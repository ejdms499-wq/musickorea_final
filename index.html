<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicKorea</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <section class="mk-top-stage" data-theme="evan">
    <div id="mkColorField" class="mk-color-field" aria-hidden="true"></div>

    <header class="mk-header">
      <div class="mk-header-row">

        <a href="index.html" class="mk-logo-link" aria-label="MusicKorea 홈">
          <img
            class="mk-logo"
            src="img/logo/musickorea_logo.webp"
            alt="MusicKorea"
          >
        </a>

        <label class="mk-search">
          <input
            id="mkSearchInput"
            type="text"
            aria-label="상품 검색"
          >
          <img
            class="mk-search-icon"
            src="img/icon/search.svg"
            alt=""
          >
        </label>

        <nav class="mk-tools" aria-label="사용자 메뉴">
          <button class="mk-tool" type="button" aria-label="마이페이지">
            <img src="img/icon/user.svg" alt="">
          </button>
          <button class="mk-tool" type="button" aria-label="장바구니">
            <img src="img/icon/bag.svg" alt="">
          </button>
          <button class="mk-tool" type="button" aria-label="안내">
            <img src="img/icon/info.svg" alt="">
          </button>
        </nav>

      </div>

      <nav id="mkNav" class="mk-nav" aria-label="주 메뉴"></nav>
    </header>

    <div class="event-carousel" aria-label="MusicKorea 이벤트 배너">
      <div id="eventTrack" class="event-track"></div>

      <button id="prevArrow" class="carousel-arrow carousel-arrow-prev" type="button" aria-label="이전 배너">
        <span></span>
      </button>
      <button id="nextArrow" class="carousel-arrow carousel-arrow-next" type="button" aria-label="다음 배너">
        <span></span>
      </button>
    </div>

    <div class="event-progress" aria-hidden="true">
      <div id="progressThumb" class="event-progress-thumb"></div>
    </div>

  </section>


  <!-- ========================================================
       MUSICKOREA EVENT PRODUCTS
  ========================================================= -->
  <section id="mkEventProducts" class="mk-event-products">

    <div class="mk-event-inner">

      <div id="mkEventHeading" class="mk-event-heading"></div>

      <div
        id="mkEventProductsWindow"
        class="mk-event-products-window"
        aria-label="뮤직코리아 이벤트상품"
      >
        <div
          id="mkEventProductsTrack"
          class="mk-event-products-track"
        ></div>
      </div>

    </div>

    <div class="mk-event-ticker" aria-hidden="true">
      <div class="mk-event-ticker-track">
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>

        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
        <span class="mk-event-ticker-item"><span>MUSICKOREA</span><b>MUKO</b></span>
      </div>
    </div>

  </section>


  <!-- ========================================================
       MUSICKOREA PREORDER PRODUCTS
  ========================================================= -->
  <section id="mkPreorder" class="mk-preorder">
    <div class="mk-preorder-inner">
      <h2 id="mkPreorderTitle" class="mk-preorder-title">예약상품</h2>
      <div id="mkPreorderGrid" class="mk-preorder-grid"></div>
    </div>
  </section>


  <!-- ========================================================
       MUSICKOREA POPULAR RANK
  ========================================================= -->
  <section id="mkRank" class="mk-rank">
    <div class="mk-rank-inner">

      <div id="mkRankHeading" class="mk-rank-heading"></div>

      <div
        id="mkRankGrid"
        class="mk-rank-grid"
        aria-label="뮤직코리아 인기 판매순위"
      ></div>

    </div>
  </section>


  <!-- ========================================================
       MUSICKOREA NEW PRODUCTS
  ========================================================= -->
  <section id="mkNewProducts" class="mk-new-products">
    <div class="mk-new-products-inner">
      <h2 id="mkNewProductsTitle" class="mk-new-products-title">신규상품</h2>

      <div
        id="mkNewProductsGrid"
        class="mk-new-products-grid"
        aria-label="신규상품"
      ></div>
    </div>
  </section>


  <!-- ========================================================
       MUSICKOREA GENRE RECOMMENDATION
  ========================================================= -->
  <section id="mkGenre" class="mk-genre">

    <button
      type="button"
      class="mk-genre-arrow mk-genre-arrow-prev"
      aria-label="이전 장르"
      tabindex="-1"
    ></button>

    <div class="mk-genre-inner">

      <div class="mk-genre-head">
        <h2 id="mkGenreTitle" class="mk-genre-title">장르별 추천음악</h2>

        <div
          id="mkGenreTabs"
          class="mk-genre-tabs"
          aria-label="국내 해외 선택"
        ></div>

        <div class="mk-genre-progress" aria-hidden="true"></div>
      </div>

      <div id="mkGenreWindow" class="mk-genre-window">
        <div id="mkGenreGrid" class="mk-genre-grid"></div>
      </div>

    </div>

    <button
      type="button"
      class="mk-genre-arrow mk-genre-arrow-next"
      aria-label="다음 장르"
      tabindex="-1"
    ></button>

  </section>


  <!-- ========================================================
       MUSICKOREA FOOTER
  ========================================================= -->
  <div id="mkFooterMount"></div>

  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
